<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador Profissional v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #f3f4f6; --bg-card: rgba(255, 255, 255, 0.8); --text-main: #111827; --accent: #4f46e5; --border: rgba(0,0,0,0.1); }
        body.dark-mode { --bg-body: #030712; --bg-card: rgba(17, 24, 39, 0.8); --text-main: #f9fafb; --border: rgba(255,255,255,0.1); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); transition: 0.5s; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; min-height: 100vh; margin: 0; }
        .card { background: var(--bg-card); backdrop-filter: blur(20px); padding: 40px; border-radius: 28px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); width: 100%; max-width: 450px; border: 1px solid var(--border); }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 5px; text-align: center; }
        #counter { font-size: 11px; text-align: center; color: var(--accent); margin-bottom: 25px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
        .upload-wrapper { display: block; border: 2px dashed var(--border); padding: 18px; margin: 12px 0; border-radius: 16px; cursor: pointer; text-align: center; transition: 0.3s; font-size: 14px; font-weight: 500; }
        .upload-wrapper:hover { border-color: var(--accent); background: rgba(79, 70, 229, 0.05); }
        button { cursor: pointer; border: none; padding: 13px; border-radius: 14px; font-weight: 600; margin: 5px 0; transition: 0.2s; }
        .main { background: var(--accent); color: white; width: 100%; font-size: 15px; }
        .secondary { background: var(--border); color: var(--text-main); width: 100%; }
        #progress-container { width: 100%; background: var(--border); border-radius: 10px; display: none; height: 6px; margin: 15px 0; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.4s; }
        .msg { padding: 12px; border-radius: 14px; margin-top: 15px; display: none; font-size: 13px; }
        .msg-error { background: #fee2e2; color: #b91c1c; }
        .timeline { list-style: none; padding: 0; margin-top: 15px; }
        .timeline li { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
        #colunas-container { margin: 15px 0; max-height: 150px; overflow-y: auto; padding: 10px; border: 1px solid var(--border); border-radius: 14px; font-size: 13px; display: none; }
        footer { margin-top: 30px; font-size: 11px; opacity: 0.6; }
        .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #2F75B5; /* Azul igual ao seu cabeçalho */
        border-radius: 50%;
        width: 25px;
        height: 25px;
        animation: spin 1s linear infinite;
        display: inline-block;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <button onclick="document.body.classList.toggle('dark-mode')">🌓 Alternar Tema</button>
        <h1>📊 Comparador 📊</h1>
        <div id="counter">Auditorias realizadas: 0</div>
        
        <label class="upload-wrapper" for="file1"><span id="label1">📁 Arquivo A</span><input type="file" id="file1" style="display:none;" onchange="updateUI(this, 'label1')"></label>
        <label class="upload-wrapper" for="file2"><span id="label2">📁 Arquivo B</span><input type="file" id="file2" style="display:none;" onchange="updateUI(this, 'label2')"></label>
        
        <div id="colunas-container">
            <p><strong>Selecione as colunas:</strong></p>
            <div id="lista-colunas"></div>
        </div>

        <button class="main" id="btn-processar" onclick="processar()" disabled>Processar Auditoria</button>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <button class="secondary" onclick="limpar()">Limpar Tudo</button>
        <div id="msgBox" class="msg"></div>

        <div id="loader" style="display: none; text-align: center; margin: 10px;">
    <div class="spinner"></div>
    <p>Processando... aguarde.</p>
</div>

        <div style="margin-top: 25px;"><strong>Timeline:</strong><ul class="timeline" id="lista-historico"></ul></div>
    </div>
    <footer style="margin-top: 40px; padding: 20px; text-align: center; color: #666; border-top: 1px solid #ddd; font-size: 0.85em;">
    <p style="margin: 5px 0;">
        <strong>Comparador Pro</strong> 
        <span style="color: #999; margin-left: 5px;">v. 1.3</span>
    </p>
    <p style="margin: 5px 0;">
        Suporte: <a href="mailto:7gaalves7@email.com" style="color: #2F75B5; text-decoration: none;">7gaalves7@email.com</a>
    </p>
    <p style="margin-top: 10px; font-size: 0.9em; color: #aaa;">
        &copy; 2026 — Desenvolvido para máxima precisão.
    </p>
</footer>

    <script>
        window.onload = () => { carregarHistorico(); atualizarContador(); };

        function updateUI(input, labelId) {
            const f = input.files[0];
            document.getElementById(labelId).innerText = "✅ " + f.name;
            verificarArquivos();
        }

        async function verificarArquivos() {
            const f1 = document.getElementById("file1").files[0];
            const f2 = document.getElementById("file2").files[0];
            if (f1 && f2) {
                const formData = new FormData(); formData.append("arquivo", f1);
                const res = await fetch("https://comparador-de-planilhas.onrender.com/listar-colunas", { method: "POST", body: formData });
                const data = await res.json();
                const lista = document.getElementById("lista-colunas");
                lista.innerHTML = data.colunas.map(c => `<div><input type="checkbox" value="${c}" checked> ${c}</div>`).join('');
                document.getElementById("colunas-container").style.display = "block";
                document.getElementById("btn-processar").disabled = false;
            }
        }

        async function processar() {
            const f1 = document.getElementById("file1").files[0], f2 = document.getElementById("file2").files[0];
            const selecionadas = Array.from(document.querySelectorAll('#lista-colunas input:checked')).map(i => i.value).join(',');
            const bar = document.getElementById("progress-bar");
            document.getElementById("progress-container").style.display = "block"; bar.style.width = "50%";

            const fd = new FormData(); fd.append("arquivo1", f1); fd.append("arquivo2", f2); fd.append("colunas_selecionadas", selecionadas);
            const res = await fetch("https://comparador-de-planilhas.onrender.com/comparar", { method: "POST", body: fd });
            
            bar.style.width = "100%";
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a"); a.href = url; a.download = "Auditoria_Final.xlsx"; a.click();
            salvarHistorico(f1.name + " & " + f2.name);
            setTimeout(() => document.getElementById("progress-container").style.display = "none", 1000);
        }

        function salvarHistorico(nome) {
            let hist = JSON.parse(localStorage.getItem('auditorias') || "[]");
            hist.unshift(nome); localStorage.setItem('auditorias', JSON.stringify(hist.slice(0,3)));
            localStorage.setItem('totalAuditorias', parseInt(localStorage.getItem('totalAuditorias') || 0) + 1);
            carregarHistorico(); atualizarContador();
        }

        function carregarHistorico() {
            document.getElementById("lista-historico").innerHTML = JSON.parse(localStorage.getItem('auditorias') || "[]").map(i => `<li>${i}</li>`).join('');
        }
        function atualizarContador() { document.getElementById("counter").innerText = "Auditorias realizadas: " + (localStorage.getItem('totalAuditorias') || 0); }
        function limpar() { window.location.reload(); }
    </script>
</body>
</html>
