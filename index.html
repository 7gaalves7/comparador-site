<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-body: #f9fafb; --bg-card: #ffffff; --text-main: #111827; 
            --text-muted: #6b7280; --accent: #4f46e5; --border: #e5e7eb;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
        }

        /* Animação de entrada */
        .card { 
            background: var(--bg-card); padding: 60px; border-radius: 24px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); 
            width: 450px; text-align: center; border: 1px solid var(--border);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { 
            font-size: 38px; font-weight: 900; margin-bottom: 8px;
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Efeito no botão */
        button { 
            background: var(--accent); color: white; border: none; 
            padding: 18px; border-radius: 12px; width: 100%; 
            cursor: pointer; font-weight: 700; font-size: 16px; margin-top: 20px;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover { transform: scale(1.02); filter: brightness(1.1); }
        button:active { transform: scale(0.98); }

        .upload-wrapper { 
            display: block; border: 2px dashed var(--border); 
            padding: 30px; margin: 24px 0; border-radius: 16px; 
            cursor: pointer; transition: 0.3s;
        }
        
        .upload-wrapper:hover { border-color: var(--accent); background: #f5f3ff; }
    </style>
</head>
<body>

    <div class="card">
        <h1>📊 Comparador 📊</h1>
        <p class="subtitle">Selecione suas planilhas para iniciar a auditoria.</p>
        
        <label class="upload-wrapper" for="file1">
            <span id="label1">📁 Selecionar Arquivo A</span>
            <input type="file" id="file1" style="display:none;" onchange="updateUI(this, 'label1')">
        </label>

        <label class="upload-wrapper" for="file2">
            <span id="label2">📁 Selecionar Arquivo B</span>
            <input type="file" id="file2" style="display:none;" onchange="updateUI(this, 'label2')">
        </label>
        
        <button onclick="processar()">Processar Dados</button>
    </div>

    <script>
        function updateUI(input, labelId) {
            if (input.files.length > 0) {
                const label = document.getElementById(labelId);
                label.innerText = "✅ " + input.files[0].name;
                label.style.color = "#4f46e5"; // Dá um feedback visual
            }
        }

        async function processar() {
            // ... (seu script de processamento permanece o mesmo)
        }
    </script>
</body>
</html>
