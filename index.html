<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Auditoria</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-body: #f9fafb; 
            --bg-card: #ffffff; 
            --text-main: #111827; 
            --text-muted: #6b7280;
            --accent: #4f46e5;
            --border: #e5e7eb;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            margin: 0;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
        }

        /* Animação de entrada do card */
        .card { 
            background: var(--bg-card); 
            padding: 60px; 
            border-radius: 24px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); 
            width: 450px; 
            text-align: center; 
            border: 1px solid var(--border);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { 
            font-size: 36px; 
            font-weight: 900; 
            margin-bottom: 8px;
            letter-spacing: -1px;
            /* Gradiente no texto */
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
        }

        .subtitle { color: var(--text-muted); margin-bottom: 40px; font-size: 16px; }

        .upload-wrapper { 
            display: block; 
            border: 2px dashed var(--border); 
            padding: 30px; 
            margin: 24px 0; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: 0.3s;
        }

        .upload-wrapper:hover { 
            border-color: var(--accent); 
            background: #f5f3ff; 
        }

        button { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 18px; 
            border-radius: 12px; 
            width: 100%; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 16px; 
            margin-top: 20px;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover { transform: scale(1.02); filter: brightness(1.1); }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <h1>📊 Comparador 📊</h1>
        <p class="subtitle">Selecione suas planilhas para iniciar a auditoria.</p>
        
        <label class="upload-wrapper" for="file1">
            <span id="label1">📁 Selecionar Arquivo A</span>
            <input type="file" id="file1" style="display:none;" onchange="updateUI(this, 'label1')">
        </label>

        <label class="upload-wrapper" for="file2">
            <span id="label2">📁 Selecionar Arquivo B</span>
            <input type="file" id="file2" style="display:none;" onchange="updateUI(this, 'label2')">
        </label>
        
        <button onclick="processar()">Processar Dados</button>
    </div>

    <script>
        function updateUI(input, labelId) {
            if (input.files.length > 0) {
                const label = document.getElementById(labelId);
                label.innerText = "✅ " + input.files[0].name;
                label.style.color = "#4f46e5";
                label.style.fontWeight = "600";
            }
        }

        async function processar() {
            const file1 = document.getElementById("file1").files[0];
            const file2 = document.getElementById("file2").files[0];

            if (!file1 || !file2) {
                alert("Selecione as duas planilhas.");
                return;
            }

            const botao = document.querySelector("button");
            botao.innerText = "Processando...";
            botao.disabled = true;

            try {
                const formData = new FormData();
                formData.append("arquivo1", file1);
                formData.append("arquivo2", file2);

                const response = await fetch("https://comparador-de-planilhas.onrender.com/comparar", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) throw new Error("Erro ao processar as planilhas.");

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "Auditoria_Completa.xlsx";
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
                alert("Auditoria concluída!");
            } catch (erro) {
                console.error(erro);
                alert("Erro ao processar os arquivos.");
            } finally {
                botao.innerText = "Processar Dados";
                botao.disabled = false;
            }
        }
    </script>
</body>
</html>
