<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Auditoria</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #f9fafb; --bg-card: #ffffff; --text-main: #111827; --accent: #4f46e5; --border: #e5e7eb; }
        body.dark-mode { --bg-body: #030712; --bg-card: #111827; --text-main: #f9fafb; --border: #1f2937; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); transition: 0.4s; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .card { background: var(--bg-card); padding: 40px; border-radius: 24px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border: 1px solid var(--border); }
        h1 { font-size: 28px; font-weight: 900; margin-bottom: 20px; text-align: center; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-main); box-sizing: border-box; }
        .upload-wrapper { display: block; border: 2px dashed var(--border); padding: 20px; margin: 15px 0; border-radius: 12px; cursor: pointer; text-align: center; }
        button.main { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 700; cursor: pointer; }
        #relatorio, #historico { margin-top: 20px; padding: 15px; border-radius: 12px; background: var(--border); font-size: 14px; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <button onclick="document.body.classList.toggle('dark-mode')" style="margin-bottom:10px;">🌓 Modo Escuro</button>
        <h1>📊 Comparador 📊</h1>
        
        <input type="text" id="colunas" placeholder="Colunas para comparar (ex: ID, Nome, Valor)">

        <label class="upload-wrapper" for="file1">
            <span id="label1">📁 Arquivo A</span>
            <input type="file" id="file1" style="display:none;" onchange="updateUI(this, 'label1')">
        </label>

        <label class="upload-wrapper" for="file2">
            <span id="label2">📁 Arquivo B</span>
            <input type="file" id="file2" style="display:none;" onchange="updateUI(this, 'label2')">
        </label>
        
        <button class="main" onclick="processar()">Processar Dados</button>

        <div id="relatorio"></div>
        <div id="historico" style="display:block;">
            <strong>Últimas auditorias:</strong>
            <ul id="lista-historico"></ul>
        </div>
    </div>

    <script>
        // Carrega histórico ao iniciar
        window.onload = carregarHistorico;

        function updateUI(input, labelId) {
            if (input.files.length > 0) document.getElementById(labelId).innerText = "✅ " + input.files[0].name;
        }

        async function processar() {
            const file1 = document.getElementById("file1").files[0];
            const file2 = document.getElementById("file2").files[0];
            const colunas = document.getElementById("colunas").value;

            if (!file1 || !file2) return alert("Selecione os arquivos!");
            
            // Simulação de processamento
            const relatorio = document.getElementById("relatorio");
            relatorio.style.display = "block";
            relatorio.innerHTML = `✅ Auditoria concluída! <br> Colunas analisadas: <b>${colunas || 'Todas'}</b>`;

            // Salvar no Histórico
            salvarHistorico(file1.name + " vs " + file2.name);
            
            alert("Processado com sucesso!");
        }

        function salvarHistorico(nome) {
            let hist = JSON.parse(localStorage.getItem('auditorias') || "[]");
            hist.unshift(nome); // Adiciona no início
            if(hist.length > 3) hist.pop(); // Mantém só os últimos 3
            localStorage.setItem('auditorias', JSON.stringify(hist));
            carregarHistorico();
        }

        function carregarHistorico() {
            const lista = document.getElementById("lista-historico");
            const hist = JSON.parse(localStorage.getItem('auditorias') || "[]");
            lista.innerHTML = hist.map(item => `<li>${item}</li>`).join('');
        }
    </script>
</body>
</html>
