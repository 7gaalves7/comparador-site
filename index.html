<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Comparador Profissional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* Variáveis Globais */
        :root { 
            --accent: #881337; /* Vinho padrão */
            --bg-body: #f3f4f6; 
            --bg-card: #ffffff; 
            --text-main: #111827; 
        }
        body.dark-mode { 
            --bg-body: #030712; 
            --bg-card: #111827; 
            --text-main: #f9fafb; 
        }

        /* Aplicação das variáveis nos elementos */
        body { font-family: sans-serif; background-color: var(--bg-body); color: var(--text-main); transition: 0.3s; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .card { background: var(--bg-card); padding: 40px; border-radius: 28px; width: 100%; max-width: 450px; border: 1px solid rgba(0,0,0,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        /* Botões usando a variável --accent */
        button { cursor: pointer; border: none; padding: 13px; border-radius: 14px; font-weight: 600; margin: 5px 0; width: 100%; transition: 0.3s; background: var(--accent); color: white; }
        .secondary { background: #4b5563; }
        
        select, .upload-wrapper { width: 100%; padding: 14px; margin: 10px 0; border-radius: 14px; border: 2px solid var(--accent); background: transparent; color: var(--text-main); box-sizing: border-box; }
        
        h1 { text-align: center; color: var(--accent); }
    </style>
</head>
<body>

    <div class="card">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button onclick="document.body.classList.toggle('dark-mode')">🌓 Alternar Modo</button>
        </div>
        
        <h1>📊 Comparador</h1>
        
        <select id="colunas-select"><option>Carregue arquivo...</option></select>
        <label class="upload-wrapper" for="file1"><input type="file" id="file1" onchange="lerCabecalhos(this)" style="display:none">📁 Arquivo A</label>
        
        <button onclick="processar()">Processar Auditoria</button>
        
        <div style="margin-top:20px; text-align:center;">
            Selecione a cor do tema: <input type="color" value="#881337" onchange="document.documentElement.style.setProperty('--accent', this.value)">
        </div>
    </div>

    <script>
        function lerCabecalhos(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const range = XLSX.utils.decode_range(sheet['!ref']);
                const select = document.getElementById('colunas-select');
                select.innerHTML = ''; 
                for(let C = range.s.c; C <= range.e.c; ++C) {
                    const header = sheet[XLSX.utils.encode_col(C) + "1"]?.v || "Coluna " + (C+1);
                    select.add(new Option(header, header));
                }
            };
            reader.readAsArrayBuffer(input.files[0]);
        }
    </script>
</body>
</html>
