<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador Profissional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #f9fafb; --bg-card: #ffffff; --text-main: #111827; --accent: #4f46e5; --border: #e5e7eb; --error: #ef4444; }
        body.dark-mode { --bg-body: #030712; --bg-card: #111827; --text-main: #f9fafb; --border: #1f2937; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); transition: 0.4s; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; min-height: 100vh; }
        .card { background: var(--bg-card); padding: 40px; border-radius: 24px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border: 1px solid var(--border); }
        h1 { font-size: 28px; font-weight: 900; margin-bottom: 5px; text-align: center; }
        #counter { font-size: 12px; text-align: center; color: var(--accent); margin-bottom: 15px; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-main); box-sizing: border-box; }
        .upload-wrapper { display: block; border: 2px dashed var(--border); padding: 20px; margin: 15px 0; border-radius: 12px; cursor: pointer; text-align: center; }
        button { cursor: pointer; border: none; padding: 12px; border-radius: 10px; font-weight: 600; margin: 5px 0; }
        .main { background: var(--accent); color: white; width: 100%; }
        .secondary { background: var(--border); color: var(--text-main); width: 100%; }
        #progress-container { width: 100%; background: var(--border); border-radius: 10px; display: none; height: 8px; margin: 10px 0; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--accent); }
        .msg { padding: 10px; border-radius: 8px; margin-top: 10px; display: none; font-size: 13px; }
        .msg-error { background: #fee2e2; color: var(--error); border: 1px solid #fecaca; }
        .msg-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>

    <div class="card">
        <div style="display: flex; justify-content: space-between;">
            <button onclick="document.body.classList.toggle('dark-mode')">🌓 Modo</button>
            <button onclick="alert('Ajuda: Selecione dois arquivos .xlsx. O limite é de 10MB por arquivo.')">ℹ️ Ajuda</button>
        </div>
        
        <h1>📊 Comparador 📊</h1>
        <div id="counter">Auditorias realizadas: 0</div>
        
        <input type="text" id="colunas" placeholder="Colunas p/ comparar (ex: ID, Nome)">

        <label class="upload-wrapper" for="file1"><span id="label1">📁 Arquivo A</span><input type="file" id="file1" style="display:none;" onchange="updateUI(this, 'label1')"></label>
        <label class="upload-wrapper" for="file2"><span id="label2">📁 Arquivo B</span><input type="file" id="file2" style="display:none;" onchange="updateUI(this, 'label2')"></label>
        
        <button class="main" onclick="processar()">Processar Dados</button>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <button class="secondary" onclick="limpar()">Limpar Tudo</button>

        <div id="msgBox" class="msg"></div>
        <div id="historico" style="margin-top: 20px;"><strong>Últimas auditorias:</strong><ul id="lista-historico"></ul></div>
    </div>

    <script>
        window.onload = () => { carregarHistorico(); atualizarContador(); };

        function mostrarMsg(texto, isError = true) {
            const m = document.getElementById("msgBox");
            m.className = "msg " + (isError ? "msg-error" : "msg-success");
            m.innerText = texto; m.style.display = "block";
        }

        function updateUI(input, labelId) {
            const file = input.files[0];
            if (!file.name.endsWith('.xlsx')) return mostrarMsg("Erro: Apenas arquivos .xlsx!");
            if (file.size > 10 * 1024 * 1024) return mostrarMsg("Erro: Arquivo muito grande (máx 10MB)!");
            document.getElementById(labelId).innerText = "✅ " + file.name;
            document.getElementById("msgBox").style.display = "none";
        }

        async function processar() {
            const f1 = document.getElementById("file1").files[0];
            const f2 = document.getElementById("file2").files[0];
            const col = document.getElementById("colunas").value;

            if (!f1 || !f2) return mostrarMsg("Selecione os dois arquivos!");
            if (!col) return mostrarMsg("Informe a coluna de comparação!");

            const bar = document.getElementById("progress-bar");
            document.getElementById("progress-container").style.display = "block";
            bar.style.width = "40%";

            try {
                const formData = new FormData();
                formData.append("arquivo1", f1); formData.append("arquivo2", f2);
                formData.append("colunas", col);

                const res = await fetch("https://comparador-de-planilhas.onrender.com/comparar", { method: "POST", body: formData });
                if (!res.ok) throw new Error("Falha na comunicação com o servidor.");

                bar.style.width = "100%";
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a"); a.href = url; a.download = "Resultado.xlsx"; a.click();
                
                mostrarMsg("Auditoria concluída com sucesso!", false);
                salvarHistorico(f1.name + " vs " + f2.name);
            } catch (e) { mostrarMsg(e.message); } 
            finally { setTimeout(() => document.getElementById("progress-container").style.display = "none", 1000); }
        }

        function salvarHistorico(nome) {
            let hist = JSON.parse(localStorage.getItem('auditorias') || "[]");
            hist.unshift(nome);
            localStorage.setItem('auditorias', JSON.stringify(hist));
            localStorage.setItem('totalAuditorias', parseInt(localStorage.getItem('totalAuditorias') || 0) + 1);
            carregarHistorico(); atualizarContador();
        }

        function atualizarContador() {
            document.getElementById("counter").innerText = "Auditorias realizadas: " + (localStorage.getItem('totalAuditorias') || 0);
        }

        function carregarHistorico() {
            const hist = JSON.parse(localStorage.getItem('auditorias') || "[]").slice(0, 3);
            document.getElementById("lista-historico").innerHTML = hist.map(item => `<li>${item}</li>`).join('');
        }

        function limpar() { window.location.reload(); }
    </script>
</body>
</html>
